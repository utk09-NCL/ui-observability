<!-- e2e/fixtures/release-page.html -->
<!--
  Loads the library release that ?release=<tag> names, from the cache that
  tools/build-release-bundle.mjs fills, and puts it on window.e2e like page.ts does.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ui-observability release test page</title>
  </head>

  <body>
    <script type="module">
      const release = new URLSearchParams(location.search).get("release") ?? "";
      if (!/^v\d+\.\d+\.\d+$/.test(release)) {
        throw new Error("The page needs ?release=v1.2.3.");
      }

      // The bundle's own chunks load next to it, and the tag's build baked its version in. The
      // page waits for the import, so a test finds window.e2e only when the library is there.
      const uiobs = await import(/* @vite-ignore */ `/e2e/.cache/${release}/dist/index.js`);
      const diagnostics = [];
      window.e2e = {
        uiobs,
        diagnostics,
        onDiagnostic: (event) => {
          diagnostics.push(event);
        },
      };
    </script>
  </body>
</html>

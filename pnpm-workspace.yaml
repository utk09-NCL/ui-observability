packages:
  - playground/react
  - playground/react-custom-backend
  - playground/angular
  - playground/microfrontend/host
  - playground/microfrontend/remote-blotter
  - playground/microfrontend/remote-ticket
  - playground/console-only
  - playground/vanilla

engineStrict: true
saveExact: true

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  fsevents: true
  lmdb: true
  msgpackr-extract: true

# These rrweb plugins import @rrweb/types in their .d.ts but don't declare it, so their types
# resolved only through pnpm's hidden hoisting, and a stale hoist folder broke lint.
packageExtensions:
  "@rrweb/rrweb-plugin-console-record":
    peerDependencies:
      # A peer takes the app's own catalog version, so no second version string can drift. The
      # range is the one the sibling network-record plugin declares.
      "@rrweb/types": "^2.1.1"
  "@rrweb/rrweb-plugin-sequential-id-record":
    peerDependencies:
      "@rrweb/types": "^2.1.1"

# oxc-parser's wasm binding (via @angular/build) pins @emnapi 2.0.0-alpha.6 next to a
# @napi-rs/wasm-runtime whose peer range skips it. Upstream still pairs them in 0.159.0.
peerDependencyRules:
  allowedVersions:
    "@napi-rs/wasm-runtime@1.2.7>@emnapi/core": "2.0.0-alpha.6"
    "@napi-rs/wasm-runtime@1.2.7>@emnapi/runtime": "2.0.0-alpha.6"

catalogs:
  library:
    "@eslint/js": "10.0.1"
    "@opentelemetry/api": "1.10.0"
    "@playwright/test": "1.58.2"
    "@types/node": "26.6.6"
    "@vitest/coverage-istanbul": "5.1.0"
    "concurrently": "10.0.7"
    "eslint": "10.15.0"
    "eslint-config-prettier": "10.1.8"
    "fake-indexeddb": "6.2.8"
    "happy-dom": "21.0.4"
    "prettier": "3.10.1"
    "rimraf": "6.1.4"
    "typescript": "6.0.3"
    "typescript-eslint": "8.72.2"
    "vite": "8.3.8"
    "vitest": "5.1.0"
    "web-vitals": "6.2.3"
    # Runs tools/mock-app-api.mjs, the WebSocket price stream of the playground apps.
    "ws": "8.22.1"
  react:
    "react": "19.3.1"
    "react-dom": "19.3.1"
    "web-vitals": "6.2.3"
    "@rrweb/record": "2.2.2"
    "@rrweb/rrweb-plugin-console-record": "2.2.2"

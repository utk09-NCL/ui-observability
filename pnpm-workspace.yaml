    "@rrweb/rrweb-plugin-sequential-id-record": "2.2.2"
    "@rrweb/rrweb-plugin-sequential-id-replay": "2.2.2"
    "@rrweb/types": "2.2.2"
    "@rrweb/utils": "2.2.2"
    "rrweb": "2.2.2"
    "rrweb-player": "2.2.2"
    "@types/react": "19.3.0"
    "@types/react-dom": "19.3.0"
    "@vitejs/plugin-react": "6.3.0"
    "typescript": "6.0.3"
    "vite": "8.3.8"
